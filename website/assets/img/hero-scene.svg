      <path d="M0 6 C-8 -2 -6 -12 0 -16 C6 -12 8 -2 0 6z" fill="#ff9fc4"/>
      <path d="M0 6 C-14 2 -16 -8 -12 -10 C-6 -6 -4 0 0 6z" fill="#ff86b3"/>
      <path d="M0 6 C14 2 16 -8 12 -10 C6 -6 4 0 0 6z" fill="#ff86b3"/>
