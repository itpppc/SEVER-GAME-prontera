      <circle cx="-3.5" cy="26" r="9" fill="#7fe3ff"/>
      <circle cx="-3.5" cy="26" r="16" fill="#7fe3ff" opacity=".25"/>
      <circle cx="2" cy="80" r="6" fill="#ffd9b8"/>
      <g fill="#7fe3ff"><circle cx="-20" cy="10" r="2"/><circle cx="12" cy="6" r="1.5"/><circle cx="-16" cy="44" r="1.5"/></g>
