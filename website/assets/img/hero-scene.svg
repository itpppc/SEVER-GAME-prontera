      <ellipse cx="25" cy="50" rx="4" ry="2.5" fill="#ff9aa2" opacity=".7"/><ellipse cx="57" cy="50" rx="4" ry="2.5" fill="#ff9aa2" opacity=".7"/>
      <path d="M36 52 Q41 56 46 52" stroke="#2a1d14" stroke-width="2" fill="none" stroke-linecap="round"/>
