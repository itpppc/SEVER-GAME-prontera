      <path d="M-5 -6 H5 L4 6 H-4z" fill="#ffb347"/>
      <path d="M-4 6 H4" stroke="#ffe7a3" stroke-width="1.5"/>
    </g>
    <!-- kranok flame curl -->
    <path id="kranok" d="M0 0 C2 -12 12 -20 22 -18 C14 -14 12 -8 16 -2 C10 -6 6 -4 6 2 C4 0 2 0 0 0z"/>
    <!-- sugar palm -->
