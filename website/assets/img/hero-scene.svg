<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="t">
  <title id="t">เมืองปราสาทยามค่ำ กับนักผจญภัยสองคนและสไลม์น่ารัก</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2350"/>
      <stop offset=".6" stop-color="#3b2f6b"/>
      <stop offset="1" stop-color="#8a4f6e"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
