      <path d="M2 50 Q0 18 30 6 Q60 18 58 50 Q30 58 2 50z" fill="#7ad38a"/>
      <path d="M12 26 Q18 16 28 14" stroke="#c9f5cf" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="21" cy="30" r="4" fill="#1d3a24"/><circle cx="39" cy="30" r="4" fill="#1d3a24"/>
      <circle cx="22" cy="28.5" r="1.4" fill="#fff"/><circle cx="40" cy="28.5" r="1.4" fill="#fff"/>
      <path d="M26 36 Q30 40 34 36" stroke="#1d3a24" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="15" cy="36" rx="3.5" ry="2" fill="#ff9aa2" opacity=".7"/><ellipse cx="45" cy="36" rx="3.5" ry="2" fill="#ff9aa2" opacity=".7"/>
      <g fill="#fffaf0"><circle cx="8" cy="42" r="3"/><circle cx="15" cy="45" r="3"/><circle cx="22" cy="47" r="3"/><circle cx="38" cy="47" r="3"/><circle cx="45" cy="45" r="3"/><circle cx="52" cy="42" r="3"/></g>
