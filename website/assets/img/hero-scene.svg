      <g stroke-width="5">
        <path d="M0 -70 l-22 -6"/><path d="M0 -70 l-18 -18"/><path d="M0 -70 l-4 -24"/>
        <path d="M0 -70 l12 -22"/><path d="M0 -70 l22 -12"/><path d="M0 -70 l24 2"/><path d="M0 -70 l-24 6"/>
      </g>
    </g>
    <!-- lotus -->
