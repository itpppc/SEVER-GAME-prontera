      <path d="M22 28 L26 10 H54 L58 28z" fill="url(#gold)"/>
      <path d="M28 10 L31 -4 H49 L52 10z" fill="#e8b64c"/>
      <path d="M33 -4 L36 -16 H44 L47 -4z" fill="url(#gold)"/>
      <path d="M37 -16 L40 -34 L43 -16z" fill="#ffd36b"/>
