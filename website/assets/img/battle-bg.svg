<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121640"/><stop offset=".55" stop-color="#3a2568"/><stop offset="1" stop-color="#a24a6a"/></linearGradient>
<linearGradient id="fire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a3a" stop-opacity="0"/><stop offset="1" stop-color="#ff6a3a" stop-opacity=".55"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".5" stop-color="#f2c14e"/><stop offset="1" stop-color="#9c6418"/></linearGradient>
<linearGradient id="lanka" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2384a"/><stop offset="1" stop-color="#5a1430"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3f8a"/><stop offset="1" stop-color="#141a48"/></linearGradient>
<linearGradient id="landL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8a56"/><stop offset="1" stop-color="#1c4a34"/></linearGradient>
<linearGradient id="landR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a3a5a"/><stop offset="1" stop-color="#32173a"/></linearGradient>
<radialGradient id="moon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d0"/><stop offset=".6" stop-color="#ffe9a0" stop-opacity=".5"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="700" fill="url(#sky)"/>
<circle cx="800" cy="150" r="150" fill="url(#moon)"/><circle cx="800" cy="150" r="58" fill="#fff4cf"/>
