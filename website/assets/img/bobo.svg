<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" role="img" aria-labelledby="bobo-t"><title id="bobo-t">โบโบ้ น้องชิวาวาตัวเมีย ใส่ชุดผ้าไทย ถือขันทำตาแป๋วขอข้าว</title>
<style>
.tail{transform-box:view-box;transform-origin:158px 222px;animation:wag 1.1s ease-in-out infinite}
.head{transform-box:view-box;transform-origin:120px 150px;animation:sway 4.8s ease-in-out infinite}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5.2s infinite}
.shiver{animation:shiver 6s linear infinite}
.tear{animation:drip 5.2s ease-in infinite}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
@keyframes shiver{0%,80%,100%{transform:translateX(0)}82%,86%,90%,94%{transform:translateX(-.8px)}84%,88%,92%,96%{transform:translateX(.8px)}}
@keyframes drip{0%,60%{transform:translateY(0);opacity:1}95%{transform:translateY(10px);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.tail,.head,.lid,.shiver,.tear{animation:none}}
</style>
<defs>
<radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f3c968" stop-opacity=".38"/><stop offset=".6" stop-color="#e8b64c" stop-opacity=".12"/><stop offset="1" stop-color="#e8b64c" stop-opacity="0"/></radialGradient>
<radialGradient id="fur" cx=".38" cy=".28" r=".8"><stop offset="0" stop-color="#5a4a60"/><stop offset=".5" stop-color="#2a2030"/><stop offset="1" stop-color="#130d17"/></radialGradient>
<radialGradient id="tan" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#f7d29e"/><stop offset=".55" stop-color="#dc9852"/><stop offset="1" stop-color="#a6602a"/></radialGradient>
<radialGradient id="wh" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f4ece2"/><stop offset="1" stop-color="#d5c6b6"/></radialGradient>
<linearGradient id="ear" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f6b8b0"/><stop offset="1" stop-color="#e98a8f"/></linearGradient>
<linearGradient id="silk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2555a"/><stop offset=".55" stop-color="#a81e3c"/><stop offset="1" stop-color="#6a0f2e"/></linearGradient>
<linearGradient id="go" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3bf"/><stop offset=".45" stop-color="#f2c14e"/><stop offset="1" stop-color="#a8681a"/></linearGradient>
<linearGradient id="si" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b97b3"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#97a3bd"/></linearGradient>
<radialGradient id="iris" cx=".42" cy=".38" r=".62"><stop offset="0" stop-color="#8a4a26"/><stop offset=".6" stop-color="#4a2210"/><stop offset="1" stop-color="#1a0b05"/></radialGradient>
<radialGradient id="pearl" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f3ece4"/><stop offset="1" stop-color="#b9ad9f"/></radialGradient>
<linearGradient id="tearg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f6ff"/><stop offset="1" stop-color="#7cc8f2"/></linearGradient>
<pattern id="lai" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M6 1 L9 6 L6 11 L3 6z" fill="none" stroke="#ffe08a" stroke-width="1" opacity=".6"/><circle cx="0" cy="0" r="1.3" fill="#ffe08a" opacity=".65"/><circle cx="12" cy="12" r="1.3" fill="#ffe08a" opacity=".65"/></pattern>
<pattern id="khan" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M5 1 L9 5 L5 9 L1 5z" fill="none" stroke="#6f7a95" stroke-width="1"/></pattern>
</defs>
<circle cx="120" cy="132" r="118" fill="url(#halo)"/>
<ellipse cx="120" cy="263" rx="72" ry="9" fill="#000" opacity=".3"/>
<g class="shiver" stroke="#2b1b33" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
  <!-- tail: wags behind the body -->
  <g class="tail">
    <path d="M156 226 C176 220 192 204 196 184 C198 174 192 168 186 174 C184 190 172 204 152 212 Z" fill="url(#fur)"/>
    <path d="M190 178 C188 192 178 204 162 212" fill="none" stroke="#dc9852" stroke-width="3"/>
  </g>
  <!-- sitting body -->
  <path d="M78 252 C66 210 84 150 120 148 C156 150 174 210 162 252 Z" fill="url(#fur)"/>
  <!-- pha nung (wrap skirt) with lai pattern and gold band -->
  <path d="M80 222 C98 232 142 232 160 222 L164 251 C142 260 98 260 76 251 Z" fill="url(#silk)"/>
  <path d="M80 222 C98 232 142 232 160 222 L164 251 C142 260 98 260 76 251 Z" fill="url(#lai)" stroke="none"/>
  <path d="M80 222 C98 232 142 232 160 222 L161 230 C142 240 98 240 79 230 Z" fill="url(#go)" stroke-width="2"/>
  <!-- back feet -->
  <ellipse cx="92" cy="253" rx="17" ry="9" fill="url(#tan)"/>
  <ellipse cx="148" cy="253" rx="17" ry="9" fill="url(#tan)"/>
  <path d="M86 249 v6 M93 248 v7 M141 248 v7 M148 249 v6" fill="none" stroke-width="1.6"/>
  <!-- white chest -->
  <path d="M100 178 C108 172 132 172 140 178 C142 196 132 210 120 212 C108 210 98 196 100 178 Z" fill="url(#wh)"/>
  <!-- sabai sash across the chest -->
  <path d="M82 186 C90 176 98 174 104 176 C122 196 142 210 162 220 L158 234 C134 224 108 206 82 186 Z" fill="url(#silk)"/>
  <path d="M82 186 C90 176 98 174 104 176 C122 196 142 210 162 220 L158 234 C134 224 108 206 82 186 Z" fill="url(#lai)" stroke="none"/>
  <path d="M104 176 C122 196 142 210 162 220" fill="none" stroke="url(#go)" stroke-width="4"/>
  <!-- arms reaching to the bowl -->
  <path d="M92 182 C84 192 80 204 84 214 L96 212 C96 202 100 192 106 186 Z" fill="url(#fur)"/>
  <path d="M148 182 C156 192 160 204 156 214 L144 212 C144 202 140 192 134 186 Z" fill="url(#fur)"/>
  <!-- khan (silver begging bowl) -->
  <path d="M82 206 C84 232 100 242 120 242 C140 242 156 232 158 206 Z" fill="url(#si)"/>
  <path d="M86 216 C100 222 140 222 154 216 L151 226 C138 232 102 232 89 226 Z" fill="url(#khan)" stroke="none"/>
  <path d="M86 216 C100 222 140 222 154 216 M89 226 C102 232 138 232 151 226" fill="none" stroke="#6f7a95" stroke-width="1.4"/>
  <ellipse cx="120" cy="206" rx="38" ry="8" fill="#c8d0e0"/>
  <ellipse cx="120" cy="207" rx="31" ry="5" fill="#5d6680" stroke="none"/>
  <path d="M104 242 h32 l-3 6 h-26 z" fill="url(#si)"/>
  <path d="M95 228 C96 234 100 237 104 238" fill="none" stroke="#fff" stroke-width="2.2" opacity=".85"/>
  <!-- front paws gripping the rim -->
  <ellipse cx="86" cy="210" rx="11" ry="9" fill="url(#tan)"/>
  <ellipse cx="154" cy="210" rx="11" ry="9" fill="url(#tan)"/>
  <path d="M82 204 v5 M88 203 v5 M150 203 v5 M156 204 v5" fill="none" stroke-width="1.5"/>
  <!-- pearl necklace -->
  <g stroke-width="1.2">
    <circle cx="102" cy="180" r="3.2" fill="url(#pearl)"/><circle cx="106" cy="186" r="3.2" fill="url(#pearl)"/>
    <circle cx="111" cy="190" r="3.2" fill="url(#pearl)"/><circle cx="116" cy="193" r="3.2" fill="url(#pearl)"/>
    <circle cx="124" cy="193" r="3.2" fill="url(#pearl)"/><circle cx="129" cy="190" r="3.2" fill="url(#pearl)"/>
    <circle cx="134" cy="186" r="3.2" fill="url(#pearl)"/><circle cx="138" cy="180" r="3.2" fill="url(#pearl)"/>
    <path d="M120 194 l5 6 l-5 6 l-5 -6 z" fill="url(#go)"/>
  </g>
  <!-- big chibi head -->
  <g class="head">
    <!-- ears, tilted out a little to look pitiful -->
    <path d="M74 86 C56 62 42 36 38 12 C62 18 90 38 106 62 Z" fill="url(#fur)"/>
    <path d="M77 76 C64 58 54 40 50 26 C67 32 85 46 97 62 Z" fill="url(#ear)" stroke-width="1.6"/>
    <path d="M56 34 C62 46 70 58 78 70" fill="none" stroke="#dc9852" stroke-width="2.4" opacity=".9"/>
    <path d="M166 86 C184 62 198 36 202 12 C178 18 150 38 134 62 Z" fill="url(#fur)"/>
    <path d="M163 76 C176 58 186 40 190 26 C173 32 155 46 143 62 Z" fill="url(#ear)" stroke-width="1.6"/>
    <path d="M184 34 C178 46 170 58 162 70" fill="none" stroke="#dc9852" stroke-width="2.4" opacity=".9"/>
    <!-- apple-dome head -->
    <path d="M120 46 C158 46 182 70 182 102 C182 136 156 158 120 158 C84 158 58 136 58 102 C58 70 82 46 120 46 Z" fill="url(#fur)"/>
    <path d="M70 84 C78 64 96 54 112 52" fill="none" stroke="#fff" stroke-width="2" opacity=".18"/>
    <!-- tan cheeks and white blaze -->
    <path d="M64 112 C70 100 88 100 100 110 C104 128 96 146 84 148 C72 144 64 128 64 112 Z" fill="url(#tan)" stroke="none"/>
    <path d="M176 112 C170 100 152 100 140 110 C136 128 144 146 156 148 C168 144 176 128 176 112 Z" fill="url(#tan)" stroke="none"/>
    <path d="M115 52 C117 48 123 48 125 52 L131 100 C131 106 109 106 109 100 Z" fill="url(#wh)" stroke="none"/>
    <!-- muzzle -->
    <path d="M94 126 C94 110 108 104 120 104 C132 104 146 110 146 126 C146 142 134 150 120 150 C106 150 94 142 94 126 Z" fill="url(#wh)"/>
    <!-- worried tan brows (inner ends raised) -->
    <ellipse cx="94" cy="76" rx="8" ry="4.6" fill="url(#tan)" transform="rotate(-22 94 76)" stroke-width="1.6"/>
    <ellipse cx="146" cy="76" rx="8" ry="4.6" fill="url(#tan)" transform="rotate(22 146 76)" stroke-width="1.6"/>
    <!-- big glossy eyes -->
    <circle cx="94" cy="100" r="19" fill="#f6efe6"/>
    <circle cx="146" cy="100" r="19" fill="#f6efe6"/>
    <circle cx="95" cy="102" r="16" fill="url(#iris)" stroke-width="2"/>
    <circle cx="145" cy="102" r="16" fill="url(#iris)" stroke-width="2"/>
    <circle cx="95" cy="103" r="7.5" fill="#0d0604" stroke="none"/>
    <circle cx="145" cy="103" r="7.5" fill="#0d0604" stroke="none"/>
    <g fill="#fff" stroke="none">
      <circle cx="89" cy="95" r="6"/><circle cx="101" cy="108" r="2.6"/><circle cx="97" cy="93" r="1.8"/>
      <circle cx="139" cy="95" r="6"/><circle cx="151" cy="108" r="2.6"/><circle cx="147" cy="93" r="1.8"/>
    </g>
    <path d="M81 112 C88 118 102 118 109 112 M131 112 C138 118 152 118 159 112" fill="none" stroke="#9fdcff" stroke-width="2.4" opacity=".9"/>
    <!-- eyelids for blinking -->
    <ellipse class="lid" cx="94" cy="100" rx="20" ry="20" fill="#2a2030" stroke-width="2"/>
    <ellipse class="lid" cx="146" cy="100" rx="20" ry="20" fill="#2a2030" stroke-width="2"/>
    <!-- tear -->
    <path class="tear" d="M80 116 C76 122 74 126 76 129 C78 132 83 131 84 127 C84 124 82 120 80 116 Z" fill="url(#tearg)" stroke-width="1.4"/>
    <!-- nose and sad little mouth -->
    <path d="M112 116 C112 112 128 112 128 116 C128 121 123 124 120 124 C117 124 112 121 112 116 Z" fill="#1a1016"/>
    <ellipse cx="116.5" cy="115" rx="2.6" ry="1.4" fill="#fff" stroke="none" opacity=".75"/>
    <path d="M120 124 V130 M109 138 C113 132 117 130 120 130 C123 130 127 132 131 138" fill="none" stroke-width="2.2"/>
    <ellipse cx="80" cy="132" rx="8" ry="4.5" fill="#ff8fa3" stroke="none" opacity=".55"/>
    <ellipse cx="160" cy="132" rx="8" ry="4.5" fill="#ff8fa3" stroke="none" opacity=".55"/>
    <!-- pearl earrings and a gold flower pin -->
    <g stroke-width="1.2">
      <circle cx="64" cy="84" r="3.6" fill="url(#pearl)"/><circle cx="60" cy="92" r="3.2" fill="url(#pearl)"/><circle cx="58" cy="100" r="4" fill="url(#pearl)"/>
      <circle cx="176" cy="84" r="3.6" fill="url(#pearl)"/><circle cx="180" cy="92" r="3.2" fill="url(#pearl)"/><circle cx="182" cy="100" r="4" fill="url(#pearl)"/>
    </g>
    <g transform="translate(158 60)" stroke-width="1.6">
      <path d="M0 -9 C4 -9 5 -4 0 0 C-5 -4 -4 -9 0 -9 Z M9 0 C9 4 4 5 0 0 C4 -5 9 -4 9 0 Z M0 9 C-4 9 -5 4 0 0 C5 4 4 9 0 9 Z M-9 0 C-9 -4 -4 -5 0 0 C-4 5 -9 4 -9 0 Z" fill="url(#go)"/>
      <circle r="2.6" fill="#e8463a"/>
    </g>
  </g>
</g>
<g fill="#ffe7a0" stroke="none"><path d="M24 70 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" opacity=".8"/><path d="M214 120 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5 l4.5 -1.5 z" opacity=".7"/></g>
</svg>
