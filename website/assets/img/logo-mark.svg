<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prontera Realm">
  <!-- Original emblem: Rama's chada crown inside a gold medallion. -->
  <defs>
    <linearGradient id="lm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset=".45" stop-color="#f3c968"/>
      <stop offset="1" stop-color="#b9781f"/>
    </linearGradient>
    <linearGradient id="lm-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset=".5" stop-color="#d9a13d"/>
      <stop offset="1" stop-color="#8a5414"/>
    </linearGradient>
    <radialGradient id="lm-core" cx=".5" cy=".38" r=".65">
      <stop offset="0" stop-color="#2a3570"/>
      <stop offset="1" stop-color="#0c1022"/>
    </radialGradient>
    <radialGradient id="lm-gem" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffd0d0"/>
      <stop offset=".5" stop-color="#e5384b"/>
      <stop offset="1" stop-color="#7a0f1c"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#lm-ring)"/>
  <circle cx="32" cy="32" r="27.5" fill="url(#lm-core)" stroke="#5a3a0e" stroke-width="1"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#e8b64c" stroke-opacity=".55" stroke-width=".8" stroke-dasharray="1.2 2.4"/>

  <!-- rays behind the crown -->
  <g stroke="#e8b64c" stroke-opacity=".18" stroke-width="1.1" stroke-linecap="round">
    <path d="M32 33 18 14M32 33 46 14M32 33 12 26M32 33 52 26"/>
  </g>

  <g stroke="#4a2c06" stroke-width=".9" stroke-linejoin="round" fill="url(#lm-gold)">
    <!-- kranok flame side pieces -->
    <path d="M19 49c-5-2-7-7-5-12 1 3 3 4 5 4-2-3-2-6 0-9 0 3 2 5 4 6l1 11z"/>
    <path d="M45 49c5-2 7-7 5-12-1 3-3 4-5 4 2-3 2-6 0-9 0 3-2 5-4 6l-1 11z"/>
    <!-- spire -->
    <path d="M29.6 22.5C31 15 31.6 9 32 5c.4 4 1 10 2.4 17.5z"/>
    <!-- tiers -->
    <path d="M27 28.5 28.6 22h6.8l1.6 6.5z"/>
    <path d="M24.5 35.5 26.4 28h11.2l1.9 7.5z"/>
    <path d="M21.5 43.5 23.8 35h16.4l2.3 8.5z"/>
    <!-- head band -->
    <path d="M18.5 43h27l-1.6 7.2c-7.4 2.1-16.4 2.1-23.8 0z"/>
  </g>

  <!-- tier trims -->
  <g fill="none" stroke="#7a4a0c" stroke-width=".7" stroke-linecap="round" opacity=".8">
    <path d="M27.4 25.3h9.2M25.4 31.8h13.2M22.6 39.4h18.8"/>
  </g>
  <g fill="#fff6d6">
    <circle cx="32" cy="5.4" r="1.1"/>
    <circle cx="25" cy="46.6" r=".9"/><circle cx="39" cy="46.6" r=".9"/>
    <circle cx="21.6" cy="46.2" r=".7"/><circle cx="42.4" cy="46.2" r=".7"/>
  </g>
  <!-- center jewel -->
  <path d="M32 42.2 35 46.4 32 50.4 29 46.4z" fill="url(#lm-gem)" stroke="#4a2c06" stroke-width=".7"/>
  <circle cx="31" cy="45.4" r=".6" fill="#fff" opacity=".9"/>
</svg>
